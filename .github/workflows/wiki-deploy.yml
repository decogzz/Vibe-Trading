name: Deploy Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "agent/src/factors/**"
      - ".github/workflows/wiki-deploy.yml"

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Both runs after the repo went private failed with "Not logged in":
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set on
    # this fork. The secrets context is NOT allowed in jobs.<id>.if (only
    # github/needs/vars/inputs), so mirror them through env and gate every
    # step; wrangler exits fast when the token is empty.
    env:
      CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare secrets
        id: cfcheck
        run: |
          if [ "${CF_TOKEN_PRESENT}" != "true" ] || [ "${CF_ACCOUNT_PRESENT}" != "true" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping wiki deploy."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfcheck.outputs.skip == '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Alpha Library pages are generated, not committed: export the
      # registry's manifest and render one page per alpha before uploading.
      - name: Set up Python
        if: steps.cfcheck.outputs.skip == '0'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the Alpha Library
        if: steps.cfcheck.outputs.skip == '0'
        run: |
          python -m pip install --quiet -e .
          vibe-trading alpha export-manifest --out wiki/alpha-library/manifest.json --force
          python wiki/scripts/build_alpha_library.py --clean
          test -f wiki/alpha-library/content/index.json

      - name: Deploy wiki
        if: steps.cfcheck.outputs.skip == '0'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy from inside wiki/ (config mode) so wrangler reads
          # wiki/wrangler.toml and compiles wiki/functions/ as Pages Functions.
          # Deploying the dir positionally (`pages deploy wiki`) uploads the
          # functions as static files and never compiles them.
          workingDirectory: wiki
          wranglerVersion: "4.98.0"
          command: pages deploy --project-name=vibetrading-wiki --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
